[project]
name = "atc"
version = "0.1.0"
description = "Voice ATC for Microsoft Flight Simulator 2020"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    "comtypes>=1.4",
    "piper-tts>=1.8",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "pywebview>=6.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
