description: >
  Arrival at EDDM with go-arounds: first the pilot reports going around after the landing clearance, then
  the pilot never calls Tower and ATC sends the aircraft around at 1.5 nm, and the third approach lands.
plan: {callsign: DLH4AB, departure: EDDH, destination: EDDM, cruise: FL350, route: AMLU2G AMLUH M852 DENIX}
metar:
  EDDH: METAR EDDH 141450Z AUTO 22007KT 9999 SCT035 07/04 Q1018 NOSIG
  EDDM: METAR EDDM 141450Z AUTO 08008KT CAVOK 06/00 Q1019 NOSIG
seed: 7
steps:
  - /com 121.705
  - Hamburg Ground, Lufthansa 4AB, request IFR clearance to Munich, information alpha
  - cleared to Munich, runway 23, climb 5000 feet, squawk {squawk}, Lufthansa 4AB
  - Lufthansa 4AB, request taxi
  - taxi to holding point A3 runway 23, Lufthansa 4AB
  - /goto holding
  - /com 121.280
  - Hamburg Tower, Lufthansa 4AB, ready for departure
  - runway 23, cleared for takeoff, Lufthansa 4AB
  - /fly 2
  - /com 118.205
  - Hamburg Approach, Lufthansa 4AB, passing 3000 climbing 5000
  - climb flight level 350, direct Amluh, Lufthansa 4AB
  - fly_until_call: [3, 330]
  - descend flight level 100, Lufthansa 4AB
  - fly_until_call: [220, 330]
  - /com 118.830
  - Munich Approach, Lufthansa 4AB, descending flight level 100
  - descend 4500 feet, QNH 1019, speed 220 knots, heading {heading}, Lufthansa 4AB
  - comment: radar vectors, flown onto a 10 nm final
  - /final 10
  - cleared ILS runway {arrival_runway}, speed 180 knots, Lufthansa 4AB
  - /com 118.705
  - Munich Tower, Lufthansa 4AB, established ILS {arrival_runway}
  - cleared to land runway {arrival_runway}, Lufthansa 4AB
  - /final 1

  - comment: 1. pilot-reported go-around
  - Going around, Lufthansa 4AB
  - heading 080, climb 5000 feet, Munich Approach 118.830, Lufthansa 4AB
  - comment: flown the missed approach and back on a 10 nm final
  - /final 10
  - /com 118.830
  - Munich Approach, Lufthansa 4AB, with you
  - descend 4500 feet, QNH 1019, cleared ILS runway {arrival_runway}, Lufthansa 4AB

  - comment: 2. the pilot switches to Tower but never calls, so there is no landing clearance at 1.5 nm
  - /com 118.705
  - /final 1.5
  - heading 080, climb 5000 feet, Munich Approach 118.830, Lufthansa 4AB
  - /final 10
  - /com 118.830
  - Munich Approach, Lufthansa 4AB, with you
  - descend 4500 feet, QNH 1019, cleared ILS runway {arrival_runway}, Lufthansa 4AB

  - comment: 3. landing
  - /com 118.705
  - Munich Tower, Lufthansa 4AB, established ILS {arrival_runway}
  - cleared to land runway {arrival_runway}, Lufthansa 4AB
  - /landed
  - /com 121.750
  - Munich Ground, Lufthansa 4AB, request taxi to the gate
