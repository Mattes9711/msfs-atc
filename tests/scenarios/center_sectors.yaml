     polygon: [[55.0, 8.0], [55.0, 13.0], [52.5, 13.0], [52.5, 8.0]]}
  - {name: Middle Radar, fir: TST2, frequency: PLACEHOLDER, lower_ft: 0, upper_ft: 66000,
