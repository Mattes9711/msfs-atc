steps:
  - /com 121.705
  - Hamburg Ground, Lufthansa 4AB, request IFR clearance to Munich, information alpha
  - cleared to Munich, runway 23, climb 5000 feet, squawk {squawk}, Lufthansa 4AB
  - Lufthansa 4AB, request taxi
  - taxi to holding point runway 23, Lufthansa 4AB
  - /goto holding
  - /com 121.280
  - Hamburg Tower, Lufthansa 4AB, ready for departure
  - runway 23, cleared for takeoff, Lufthansa 4AB
  - /fly 2
  - /com 118.205
  - Hamburg Approach, Lufthansa 4AB, passing 3000 climbing 5000
  - comment: with Center sectors, Departure climbs only to FL240
  - climb flight level 240, direct Amluh, Lufthansa 4AB
  - comment: passing FL100, Departure hands off to the sector we are in
  - fly_until_call: [3, 330]
  - /com 123.450
  - North Radar, Lufthansa 4AB, with you, climbing flight level 240
  - comment: the first Center gives the rest of the climb
  - climb flight level 350, Lufthansa 4AB
  - comment: Middle Radar's frequency is a PLACEHOLDER, so North Radar keeps us
  - fly_until_call: [19, 330]
  - fly_until_call: [71, 330]
  - /com 132.600
  - South Upper Radar, Lufthansa 4AB, with you, flight level 350
  - fly_until_call: [163, 330]
  - descend flight level 100, Lufthansa 4AB
  - comment: descending through FL245 into the lower sector
  - fly_until_call: [220, 330]
  - /com 129.100
  - South Radar, Lufthansa 4AB, with you, descending 5000
  - fly_until_call: [252, 330]
  - /com 118.830
  - Munich Approach, Lufthansa 4AB, with you
