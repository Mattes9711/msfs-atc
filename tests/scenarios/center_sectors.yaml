description: >
  En-route Center handoffs with test sectors across the route (test frequencies, not real ones): Departure to
  North Radar, a PLACEHOLDER sector that gets no handoff, North to South Upper, the altitude band down to
  South Radar, and South Radar to Munich Approach.
plan: {callsign: DLH4AB, departure: EDDH, destination: EDDM, cruise: FL350, route: AMLU2G AMLUH M852 DENIX}
metar:
  EDDH: METAR EDDH 141450Z AUTO 22007KT 9999 SCT035 07/04 Q1018 NOSIG
  EDDM: METAR EDDM 141450Z AUTO 08008KT CAVOK 06/00 Q1019 NOSIG
seed: 7
centers:
